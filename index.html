<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1e9" />
    <script>
      (() => {
        let theme, motion;
        try {
          theme = localStorage.getItem("portfolio-theme");
          motion = localStorage.getItem("portfolio-motion");
        } catch {}
        const root = document.documentElement;
        root.dataset.theme =
          theme === "dark" || theme === "light"
            ? theme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        root.dataset.motion =
          motion === "paused" ||
          matchMedia("(prefers-reduced-motion: reduce)").matches
            ? "paused"
            : "running";
        root.style.colorScheme = root.dataset.theme;
      })();
    </script>
    <meta
      name="description"
      content="Tarun Kishore — Software Development Engineer II. Java, Spring Boot, distributed systems, and the engineering behind reliable responses."
    />
    <meta property="og:title" content="Tarun Kishore — Behind the response" />
    <meta
      property="og:description"
      content="Backend engineering, distributed systems, and selected work by Tarun Kishore."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <title>Tarun Kishore — Backend Engineer</title>
  </head>
